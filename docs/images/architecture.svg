<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Helio Assistant architecture on Google Cloud</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6070"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d5d2ca; stroke-width: 1.5; }
      .zone { fill: #f6f4ef; stroke: #c9c5bb; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .agent { fill: #fff4ea; stroke: #ea6a0a; stroke-width: 1.5; }
      .guard { fill: #eef4ff; stroke: #3d6fd6; stroke-width: 1.5; }
      .store { fill: #eef8f1; stroke: #2f8f57; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 700; fill: #16171a; }
      .label { font-size: 13px; font-weight: 600; fill: #16171a; }
      .sub { font-size: 11.5px; fill: #5b6070; }
      .zoneLabel { font-size: 12px; font-weight: 700; fill: #5b6070; letter-spacing: 0.08em; }
      .line { stroke: #5b6070; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #5b6070; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fbfaf7"/>

  <!-- Browser -->
  <rect class="box" x="30" y="270" width="150" height="120" rx="12"/>
  <text class="title" x="105" y="306" text-anchor="middle">Browser</text>
  <text class="sub" x="105" y="328" text-anchor="middle">React UI: answers,</text>
  <text class="sub" x="105" y="344" text-anchor="middle">citations, charts,</text>
  <text class="sub" x="105" y="360" text-anchor="middle">trace, approvals</text>
  <path class="line" d="M180 330 L238 330"/>
  <text class="sub" x="209" y="318" text-anchor="middle">HTTPS</text>

  <!-- Cloud Run -->
  <rect class="zone" x="240" y="40" width="610" height="620" rx="16"/>
  <text class="zoneLabel" x="262" y="66">CLOUD RUN · ONE CONTAINER (API + BUILT FRONTEND)</text>

  <rect class="guard" x="262" y="84" width="566" height="56" rx="10"/>
  <text class="label" x="545" y="107" text-anchor="middle">Access code · per-client rate limit · daily token budget</text>
  <text class="sub" x="545" y="126" text-anchor="middle">Past the budget, answers switch to the offline model instead of failing</text>
  <path class="line" d="M545 140 L545 168"/>

  <rect class="agent" x="380" y="170" width="330" height="60" rx="10"/>
  <text class="label" x="545" y="194" text-anchor="middle">Supervisor</text>
  <text class="sub" x="545" y="213" text-anchor="middle">Validated JSON plan, made before anything is retrieved</text>

  <path class="line" d="M470 230 L400 268"/>
  <path class="line" d="M620 230 L690 268"/>

  <rect class="agent" x="262" y="270" width="270" height="70" rx="10"/>
  <text class="label" x="397" y="295" text-anchor="middle">Docs agent</text>
  <text class="sub" x="397" y="314" text-anchor="middle">Hybrid search (vector + full-text), ACL in SQL,</text>
  <text class="sub" x="397" y="330" text-anchor="middle">rerank, injection text redacted</text>

  <rect class="agent" x="558" y="270" width="270" height="70" rx="10"/>
  <text class="label" x="693" y="295" text-anchor="middle">Data agent</text>
  <text class="sub" x="693" y="314" text-anchor="middle">Text-to-SQL, validated, run read-only;</text>
  <text class="sub" x="693" y="330" text-anchor="middle">self-repair, reviewed-query fallback</text>

  <path class="dash" d="M532 300 L556 300"/>
  <text class="sub" x="545" y="360" text-anchor="middle">findings</text>

  <path class="line" d="M397 340 L490 378"/>
  <path class="line" d="M693 340 L600 378"/>

  <rect class="agent" x="380" y="380" width="330" height="60" rx="10"/>
  <text class="label" x="545" y="404" text-anchor="middle">Analyst</text>
  <text class="sub" x="545" y="423" text-anchor="middle">[S#] / [T#] citations checked · links and images stripped</text>
  <path class="line" d="M545 440 L545 468"/>

  <rect class="agent" x="380" y="470" width="330" height="60" rx="10"/>
  <text class="label" x="545" y="494" text-anchor="middle">Action agent (only when asked)</text>
  <text class="sub" x="545" y="513" text-anchor="middle">Drafts one typed tool call, checks duplicates</text>
  <path class="line" d="M545 530 L545 558"/>

  <rect class="guard" x="380" y="560" width="330" height="76" rx="10"/>
  <text class="label" x="545" y="584" text-anchor="middle">Human approval (graph interrupt)</text>
  <text class="sub" x="545" y="603" text-anchor="middle">Policy re-checked, arguments hash-bound,</text>
  <text class="sub" x="545" y="619" text-anchor="middle">executed at most once, audited</text>

  <rect class="box" x="262" y="560" width="100" height="76" rx="10"/>
  <text class="label" x="312" y="590" text-anchor="middle">Tracker</text>
  <text class="sub" x="312" y="607" text-anchor="middle">MCP server</text>
  <text class="sub" x="312" y="622" text-anchor="middle">(subprocess)</text>
  <path class="line" d="M380 598 L364 598"/>

  <!-- Data and services -->
  <rect class="store" x="900" y="84" width="270" height="170" rx="12"/>
  <text class="title" x="1035" y="112" text-anchor="middle">Cloud SQL · PostgreSQL 16</text>
  <text class="sub" x="920" y="138">• documents + chunks: pgvector, tsvector, ACLs</text>
  <text class="sub" x="920" y="160">• analytics schema, read by a read-only role</text>
  <text class="sub" x="920" y="182">• LangGraph checkpoints (resume, pauses)</text>
  <text class="sub" x="920" y="204">• runs, tokens, actions, append-only audit</text>
  <text class="sub" x="920" y="232">Unix socket via the Cloud SQL connector</text>

  <rect class="box" x="900" y="290" width="270" height="80" rx="12"/>
  <text class="title" x="1035" y="318" text-anchor="middle">OpenAI</text>
  <text class="sub" x="1035" y="340" text-anchor="middle">gpt-4.1-mini (chat, planning, SQL, rerank)</text>
  <text class="sub" x="1035" y="357" text-anchor="middle">text-embedding-3-small</text>

  <rect class="box" x="900" y="406" width="270" height="70" rx="12"/>
  <text class="title" x="1035" y="434" text-anchor="middle">Secret Manager</text>
  <text class="sub" x="1035" y="456" text-anchor="middle">model key · access code · database URL</text>

  <rect class="box" x="900" y="512" width="270" height="124" rx="12"/>
  <text class="title" x="1035" y="540" text-anchor="middle">Observability</text>
  <text class="sub" x="1035" y="563" text-anchor="middle">Cloud Trace: request → node → model / SQL</text>
  <text class="sub" x="1035" y="581" text-anchor="middle">/ MCP spans with token counts</text>
  <text class="sub" x="1035" y="603" text-anchor="middle">Cloud Logging: structured JSON, trace-linked</text>
  <text class="sub" x="1035" y="621" text-anchor="middle">Uptime check on /health/ready</text>

  <path class="line" d="M828 305 C 870 305, 860 170, 898 170"/>
  <path class="line" d="M710 410 L898 330"/>
  <path class="dash" d="M850 441 L898 441"/>
  <path class="dash" d="M850 574 L898 574"/>
</svg>
