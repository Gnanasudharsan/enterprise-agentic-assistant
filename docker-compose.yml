name: enterprise-agentic-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reachable as "db".
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Forward the host's key (if any); with LLM_PROVIDER=auto it enables the real model.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCUMENTS_DIR: /app/datasets/documents
      SEED_DOCUMENTS_ON_STARTUP: ${SEED_DOCUMENTS_ON_STARTUP:-true}
      # Issue tracker for approved actions: the local SQLite tracker by default. For GitHub
      # Issues, set TRACKER_BACKEND=github, GITHUB_REPO=owner/name, and a fine-grained
      # GITHUB_TOKEN with only "Issues: read and write" on that repository.
      TRACKER_BACKEND: ${TRACKER_BACKEND:-local}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Second-stage reranking of retrieved passages ("llm" or "none").
      RERANKER: ${RERANKER:-none}
      # OpenTelemetry: TRACING=otlp with `docker compose --profile tracing up` sends traces
      # to the bundled Jaeger (UI on http://localhost:16686). LangSmith: set
      # LANGSMITH_TRACING=true and LANGSMITH_API_KEY.
      TRACING: ${TRACING:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    volumes:
      - ./datasets:/app/datasets:ro
      - trackerdata:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    profiles: ["tracing"]
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP

volumes:
  pgdata:
  trackerdata:
