<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Images only from this origin or inline: rendered model output cannot beacon data out. -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />
    <title>Helio Assistant</title>
    <meta name="theme-color" content="#0f1013" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1013'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23ff7a1a'/%3E%3Cg stroke='%23ff7a1a' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 5v3M16 24v3M5 16h3M24 16h3M8.2 8.2l2.1 2.1M21.7 21.7l2.1 2.1M8.2 23.8l2.1-2.1M21.7 10.3l2.1-2.1'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("eaa.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
