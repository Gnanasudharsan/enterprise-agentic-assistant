name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  integration:
    name: Backend integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://assistant:ci-password@localhost:5432/assistant_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -v -m integration
      - name: Models match migrations
        run: alembic check

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health/ready && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Grounded chat round-trip (seeded corpus, offline embedder)
        run: |
          curl -sf -X POST localhost:8000/api/v1/chat \
            -H 'content-type: application/json' \
            -d '{"prompt":"How many unused PTO days carry over?"}' > answer.json
          cat answer.json
          python3 -c "import json; d=json.load(open('answer.json')); assert d['retrieval']=='used', d; assert d['sources'][0]['doc_key']=='HR-001', d['sources'][0]; assert d['citations']==[1], d"
      - name: Multi-agent run (offline plan, reviewed SQL, Postgres checkpoints)
        run: |
          curl -sf -X POST localhost:8000/api/v1/agent/run \
            -H 'content-type: application/json' \
            -d '{"prompt":"How many kyb verification tickets did we get per month?"}' > run.json
          python3 -c "import json; d=json.load(open('run.json')); t=d['tables'][0]; print(d['status'], t['title'], t['rows']); assert d['status']=='succeeded', d; assert [r[1] for r in t['rows'] if r[0]=='2026-09']==[118], t; assert d['citations']['tables']==[1], d['citations']; assert d['usage']['llm_calls']>=1 and d['usage']['prompt_tokens']>0, d['usage']"
          curl -sf localhost:8000/api/v1/agent/runs/$(python3 -c "import json; print(json.load(open('run.json'))['run_id'])") > /dev/null
      - name: Approved action (proposal pauses the run; MCP tracker creates the issue on approval)
        run: |
          curl -sf -X POST localhost:8000/api/v1/agent/run \
            -H 'content-type: application/json' \
            -d '{"prompt":"What caused INC-204? Create a follow-up issue for the async queue."}' > act.json
          python3 -c "import json; d=json.load(open('act.json')); assert d['status']=='needs_approval', d['trace']; assert d['actions'][0]['status']=='proposed'"
          RUN=$(python3 -c "import json; print(json.load(open('act.json'))['run_id'])")
          ACTION=$(python3 -c "import json; print(json.load(open('act.json'))['actions'][0]['id'])")
          curl -sfN -X POST "localhost:8000/api/v1/agent/runs/$RUN/actions/$ACTION/decision" \
            -H 'content-type: application/json' -d '{"decision":"approve"}' > /dev/null
          curl -sf "localhost:8000/api/v1/actions/$ACTION" > done.json
          python3 -c "import json; a=json.load(open('done.json')); print(a['status'], a['result']); assert a['status']=='executed', a; assert [e['event'] for e in a['audit']]==['proposed','approved','executing','executed']"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "localhost:8000/api/v1/agent/runs/$RUN/actions/$ACTION/decision" -H 'content-type: application/json' -d '{"decision":"approve"}')" = 409
      - if: always()
        run: docker compose down -v

  production-image:
    name: Production image (API + frontend, access code)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: test
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U assistant" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t helio-assistant .
      - name: Start like Cloud Run does (PORT, production settings, access code)
        run: |
          docker run -d --name app --network host -e PORT=8080 \
            -e POSTGRES_HOST=localhost -e POSTGRES_PASSWORD=test \
            -e SEED_DOCUMENTS_ON_STARTUP=true -e ACCESS_CODE=ci-code \
            -e RATE_LIMIT_REQUESTS=5 -e DAILY_TOKEN_BUDGET=100000 -e DB_POOL_SIZE=3 helio-assistant
          for i in $(seq 1 60); do curl -sf localhost:8080/health/ready && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Frontend, gate, and an answer
        run: |
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/some/client/route | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/info)" = 401
          curl -sf -H 'X-Access-Code: ci-code' -X POST localhost:8080/api/v1/chat \
            -H 'content-type: application/json' -d '{"prompt":"How many unused PTO days carry over?"}' > a.json
          python3 -c "import json; d=json.load(open('a.json')); assert d['citations']==[1], d"
          docker logs app 2>&1 | grep -q '"severity": "INFO"'  # structured logs
      - if: always()
        run: docker rm -f app

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
